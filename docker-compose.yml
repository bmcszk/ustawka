version: '3.8'

services:
  ustawka:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      - USTAWKA_PORT=8080
      - SEJM_DB_PATH=/app/data/sejm.db
      - SEJM_API_TIMEOUT=30s
      - SEJM_CACHE_TTL=24h
    volumes:
      # Mount data directory to persist database
      - ustawka_data:/app/data
      # Mount logs directory for debugging
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - ustawka_network

volumes:
  ustawka_data:
    driver: local

networks:
  ustawka_network:
    driver: bridge